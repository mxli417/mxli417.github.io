title: "Mxli's personal page"
author: "mxli417"
description: "Applied machine learning, NLP, and statistics: research papers, open-source projects, and technical notes by Maximilian Meidinger."
url: "https://mxli417.github.io"
baseurl: ""
exclude: [README.md, BACKLOG.md, thought_archive, scripts]
permalink: /:title/
lang: "en"
excerpt_separator: "\n\n\n"
date_format: "%B %d, %Y"

# Layout

show_excerpts: false        # show article excerpts on the home page
show_frame: false           # adds a gray frame to the site
show_sidebar: false        # show a sidebar instead of the usual header
minimal: true             # use a dark header

# Menu

navigation:                # accepts {file, title, url, icon, sidebaricon}
  - {file: "projects.md", title: Projects}
  - {file: "blog.md", title: Blog}
  - {file: "research.md", title: Research}
  - {file: "about_me.md", title: About me}

external:                  # shows a footer with social links - for available icons see fontawesome.com/icons
  - {title: Mail, icon: envelope, url: "mailto:mx.meidinger@outlook.com"}
  - {title: Github, icon: github, url: "https://github.com/mxli417"}
  - {title: Subscribe, icon: rss, url: "/feed.xml"}

comments:
#  disqus_shortname: ""    # see https://disqus.com/
#  isso_domain: ""         # see https://posativ.org/isso/

plugins:
 - jekyll-feed
