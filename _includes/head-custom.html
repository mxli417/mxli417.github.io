<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/imgs/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/imgs/favicon-192.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/imgs/apple-touch-icon.png' | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/css/site.css" | relative_url }}">
{% if page.mathjax or site.mathjax %}
<link rel="stylesheet" href="{{ "/assets/katex/katex.min.css" | relative_url }}">
<script defer src="{{ "/assets/katex/katex.min.js" | relative_url }}"></script>
<script defer src="{{ "/assets/katex/contrib/auto-render.min.js" | relative_url }}" onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '\\[', right: '\\]', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}]})"></script>
{% endif %}
