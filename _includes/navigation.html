<nav id="primary-nav" class="site-nav" aria-label="Main navigation">
  <ul>
    {% for item in site.navigation %}
      {% assign node = site.pages | where: 'name', item.file | first %}
      {% assign item_url = node.url | default: item.url %}
      <li><a href="{{ item_url | relative_url }}"{% if item_url == page.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
    {% endfor %}
  </ul>
</nav>
